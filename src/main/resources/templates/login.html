<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>HealthAI - Login</title>

    <link rel="stylesheet" href="/css/style.css">

</head>

<body>

<div class="auth-container">

    <div class="auth-card">

        <!-- Logo -->
        <div class="logo">
            <span>Health</span><strong>AI</strong>
        </div>


        <!-- Heading -->
        <h1>Welcome Back</h1>

        <p class="subtitle">
            Login to continue to HealthAI
        </p>


        <!-- Login Form -->
        <form>

            <!-- Email -->
            <div class="input-group">

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required>

            </div>


            <!-- Password -->
            <div class="input-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    required>

            </div>


            <!-- Remember / Forgot -->
            <div class="login-options">

                <label class="remember-me">

                    <input
                        type="checkbox"
                        id="remember">

                    <span>Remember me</span>

                </label>

                <a href="#" class="forgot-password">
                    Forgot Password?
                </a>

            </div>


            <!-- Login Button -->
            <button
                type="submit"
                class="auth-button">

                Login

            </button>

        </form>


        <!-- Signup Link -->
        <p class="switch-auth">

            Don't have an account?

            <a href="/signup">
                Create Account
            </a>

        </p>

    </div>

</div>

</body>

</html>
