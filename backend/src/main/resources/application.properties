spring.application.name=healthai
server.port=8080

# ─────────────────────────────────────────────────────────────
# Database configuration
# Override credentials via environment variables so that real
# passwords are never committed to GitHub:
#   SPRING_DATASOURCE_USERNAME  (default: root)
#   SPRING_DATASOURCE_PASSWORD  (default: root)
# ─────────────────────────────────────────────────────────────
spring.datasource.url=jdbc:mysql://localhost:3306/healthai_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ─────────────────────────────────────────────────────────────
# Flyway – manages all schema changes automatically on startup.
# Migration SQL files live under:  db/migration/V<N>__description.sql
# NEVER edit an already-committed migration file.
# ─────────────────────────────────────────────────────────────
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# ─────────────────────────────────────────────────────────────
# JPA / Hibernate
# "validate" = Hibernate checks that entity fields match the DB
# schema but does NOT create or alter tables. Flyway owns DDL.
# ─────────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=validate

# Independently deployed frontend. Legacy page routes redirect here.
app.frontend.url=http://localhost:5173
app.frontend.allowed-origin=http://localhost:5173

# Logging
logging.level.org.springframework.web=INFO
logging.level.com.healthai=DEBUG
logging.level.org.flywaydb=INFO
