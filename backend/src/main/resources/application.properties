spring.application.name=healthai
server.port=8080


# =====================================================
# Database Configuration
# =====================================================

spring.datasource.url=jdbc:mysql://localhost:3306/healthai_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC

spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# =====================================================
# Flyway Database Migration
# =====================================================

spring.flyway.baseline-version=0
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true


# =====================================================
# JPA / Hibernate
# =====================================================

# Flyway manages database schema.
# Hibernate only validates Entity <-> Database structure.

spring.jpa.hibernate.ddl-auto=validate


# =====================================================
# Frontend Configuration
# =====================================================

app.frontend.url=http://localhost:5173

app.frontend.allowed-origin=http://localhost:5173


# =====================================================
# Logging
# =====================================================

logging.level.org.springframework.web=INFO

logging.level.com.healthai=DEBUG

logging.level.org.flywaydb=INFO

# ============================================================
# DevTools — disable auto-restart so long-running bulk imports
# are not interrupted by classpath change detection.
# ============================================================
spring.devtools.restart.enabled=false

# ============================================================
# MedlinePlus Configuration
# ============================================================

medlineplus.base-url=https://wsearch.nlm.nih.gov/ws/query
medlineplus.database=healthTopics
medlineplus.rettype=topic
medlineplus.tool=HealthAI-Nirvikar

# ============================================================
# Admin — Bulk Import Protection
# Change this value before deploying to any shared environment.
# Required as X-Admin-Key header in POST /api/disease-import/bulk
# ============================================================
app.admin.import-key=healthai-admin-2024-secret


# =====================================================
# HealthAI - Nearby Hospital Search
# =====================================================

# OpenStreetMap Overpass API

app.overpass.url=https://overpass-api.de/api/interpreter


# Default hospital search radius

hospital.search.radius.km=5


# Maximum allowed hospital search radius

hospital.search.max-radius.km=50


# Hospital cache expiry

hospital.cache.expiry.days=7


# =====================================================
# Overpass API HTTP Timeout
# =====================================================

# Connection timeout

hospital.api.connect-timeout.seconds=5


# Response/read timeout

hospital.api.read-timeout.seconds=20


# =====================================================
# Government Schemes Configuration
# =====================================================

# Enable external official API integration (e.g., API Setu / myScheme API)
# When set to false or when external call fails, system seamlessly uses the local verified snapshot.
gov.schemes.api.enabled=${GOV_SCHEMES_API_ENABLED:false}
gov.schemes.api.url=${GOV_SCHEMES_API_URL:}
gov.schemes.api.api-key=${GOV_SCHEMES_API_KEY:}
gov.schemes.api.client-id=${GOV_SCHEMES_CLIENT_ID:}
gov.schemes.api.timeout.seconds=${GOV_SCHEMES_TIMEOUT_SECONDS:5}