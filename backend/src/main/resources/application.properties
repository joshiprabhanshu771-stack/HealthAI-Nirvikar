spring.application.name=healthai
server.port=8080

# Database configuration
spring.datasource.url=jdbc:mysql://localhost:3306/healthai_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Independently deployed frontend. Legacy page routes redirect here.
app.frontend.url=http://localhost:5173
app.frontend.allowed-origin=http://localhost:5173

# Logging
logging.level.org.springframework.web=INFO
logging.level.com.healthai=DEBUG
